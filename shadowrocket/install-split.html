<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadowrocket Ozon/WB 分流</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f7fb;margin:0;padding:22px;color:#172033}.card{max-width:520px;margin:24px auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 36px rgba(15,23,42,.08)}h1{font-size:22px;margin:0 0 10px}p{color:#667085;line-height:1.65;font-size:14px}.ok{background:#ecfdf3;border:1px solid #abefc6;border-radius:14px;padding:12px;font-size:13px;line-height:1.6;margin:14px 0}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:15px 14px;margin-top:12px;font-size:16px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#eef4ff;color:#1d4ed8;border:1px solid #bfd3ff}.note{font-size:12px;color:#667085;margin-top:15px;line-height:1.6}</style></head><body><div class="card"><h1>Ozon / WB 分流设置</h1><p>目标：Ozon 与 Wildberries 走中国手机网络直连；其他流量继续走你当前选中的 Shadowrocket 代理节点。</p><div class="ok">① 安装分流模块<br>② 返回本页，再切换“全局路由”为“配置”<br>③ Shadowrocket 总开关继续保持开启</div><button class="btn primary" onclick="installModule()">① 安装 Ozon/WB 直连模块</button><button class="btn secondary" onclick="setConfig()">② 切换全局路由为「配置」</button><p class="note">如果 Shadowrocket 弹出安装确认，请允许并启用模块。模块只改路由，不做HTTPS解密，不安装证书。需要恢复原状时，把“全局路由”切回「代理」即可。</p></div><script>const moduleUrl='https://raw.githubusercontent.com/cjfan1984/20250624-rev1/7476ae9544ceccf78ecf9cc56a7a8a32f2e939ce/shadowrocket/ozon-wb-direct.sgmodule';function installModule(){location.href='shadowrocket://install?module='+encodeURIComponent(moduleUrl)}function setConfig(){location.href='shadowrocket://route/config'}</script></body></html>
