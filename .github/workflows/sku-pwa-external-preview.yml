name: SKU PWA External Data Preview

on:
  push:
    branches: [sku-pwa-auth-test]
    paths:
      - 'sku-pwa-auth-tools/externalize_pwa_payload.py'
      - 'sku-pwa-auth-tools/build_external_site.py'
      - 'sku-pwa-auth-src/sw.external.js'
      - 'sku-pwa-auth-src/index.part*'
      - 'sku-pwa-auth-src/full-envelope.part*'
      - 'sku-pwa-auth-src/hybrid-keyring.json'
      - 'tests-pwa-auth/external-loader.mjs'
      - '.github/workflows/sku-pwa-external-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sku-pwa-external-preview-v2
  cancel-in-progress: true

jobs:
  build-test-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build external encrypted PWA
        run: |
          python sku-pwa-auth-tools/build_external_site.py --output /tmp/external-site | tee external-build.json
          test -s /tmp/external-site/index.html
          test -s /tmp/external-site/sku-data.enc.json
          test -s /tmp/external-site/pwa-data-version.json
          grep -q 'sku-data.enc.json' /tmp/external-site/index.html
          grep -q 'pwa-data-version.json' /tmp/external-site/index.html
          ! grep -q '"kind":"SKU-PWA-HYBRID-ENVELOPE"' /tmp/external-site/index.html
          ! grep -q '手动抽芯铆钉枪' /tmp/external-site/index.html
          ! grep -q '声光漏水报警器' /tmp/external-site/index.html
          grep -q 'networkFirst' /tmp/external-site/sw.js
          grep -q 'SKU自动化中心' /tmp/external-site/sw.js
          ! grep -q 'ensureChatGptBridge();renderAutomationCenter();' /tmp/external-site/sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          nohup python3 -m http.server 4175 --directory /tmp/external-site > external-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4175/index.html >/dev/null && exit 0; sleep 1; done
          cat external-server.log; exit 1
      - name: Browser network-first and offline QA
        timeout-minutes: 4
        env:
          PWA_URL: http://127.0.0.1:4175/index.html
        run: node tests-pwa-auth/external-loader.mjs | tee external-browser.json
      - name: Publish clean preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/external-publish
          git worktree add --detach /tmp/external-publish HEAD
          cd /tmp/external-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/external-site/. .
          git add -A
          git commit -m "Preview external encrypted SKU PWA"
          PREVIEW_SHA=$(git rev-parse HEAD)
          git push --force origin HEAD:refs/heads/sku-pwa-auth-external-preview
          echo "$PREVIEW_SHA" > /tmp/external-preview-sha.txt
      - name: Verify public preview assets
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/external-preview-sha.txt)
          BASE="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/${SHA}"
          for i in {1..36}; do
            if curl -fsSL "$BASE/index.html" -o preview-index.html \
              && curl -fsSL "$BASE/pwa-data-version.json" -o preview-version.json \
              && curl -fsSL "$BASE/sku-data.enc.json" -o preview-data.json; then break; fi
            sleep 5
          done
          test -s preview-index.html; test -s preview-version.json; test -s preview-data.json
          ! grep -q '"kind":"SKU-PWA-HYBRID-ENVELOPE"' preview-index.html
          python3 - <<'PY'
          import json
          v=json.load(open('preview-version.json'));d=json.load(open('preview-data.json'))
          assert d['kind']=='SKU-PWA-HYBRID-ENVELOPE'
          assert d['records']==v['records'] and d['records']>0
          print('public preview records',d['records'],'version',v['version'])
          PY
      - name: Upload external preview QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: sku-pwa-external-preview
          path: |
            external-build.json
            external-browser.json
            preview-version.json
          retention-days: 7
