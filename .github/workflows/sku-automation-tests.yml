name: SKU Automation Modules QA

on:
  push:
    branches: [sku-pwa-auth-test]
    paths:
      - 'sku-pwa-auth-tools/**'
      - 'sku-pwa-auth-src/sw.external.js'
      - 'tests-pwa-auth/test_automation_modules.py'
      - 'tests-pwa-auth/test_external_pwa.py'
      - '.github/workflows/sku-automation-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest cryptography
      - name: Compile automation programs
        run: |
          python -m py_compile \
            sku-pwa-auth-tools/automation_modules.py \
            sku-pwa-auth-tools/sync_dynamic_sku.py \
            sku-pwa-auth-tools/build_dynamic_pwa_data.py \
            sku-pwa-auth-tools/ingest_daily_skus.py \
            sku-pwa-auth-tools/externalize_pwa_payload.py \
            sku-pwa-auth-tools/build_external_site.py
      - name: Run automation regression tests
        run: pytest -q tests-pwa-auth/test_automation_modules.py tests-pwa-auth/test_external_pwa.py
