name: Dynamic SKU Sync Tests

on:
  push:
    branches: [sku-pwa-auth-test]
    paths:
      - 'sku-pwa-auth-tools/sync_dynamic_sku.py'
      - 'tests-pwa-auth/test_sync_dynamic_sku.py'
      - 'requirements.txt'
      - '.github/workflows/dynamic-sku-sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt
      - name: Run dynamic SKU sync unit tests
        run: python -m unittest tests-pwa-auth/test_sync_dynamic_sku.py
      - name: Compile sync tool
        run: python -m py_compile sku-pwa-auth-tools/sync_dynamic_sku.py
