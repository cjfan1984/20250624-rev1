name: SKU PWA One-Time Password Rotation

on:
  push:
    branches: [sku-pwa-auth-test]
    paths:
      - "tools/rotate-server.mjs"
      - ".github/workflows/sku-pwa-rotate.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sku-pwa-password-rotation
  cancel-in-progress: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load current encrypted production build
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sku-pwa-auth-public:refs/remotes/origin/sku-pwa-auth-public
          git show origin/sku-pwa-auth-public:index.html > /tmp/current-index.html
          grep -q 'const ENCRYPTED_PAYLOAD=' /tmp/current-index.html
          ! grep -q '声光漏水报警器' /tmp/current-index.html
      - name: Start one-time local rotation service
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          printf '%s' "$TOKEN" > /tmp/rotate-token
          ROTATE_TOKEN="$TOKEN" CURRENT_INDEX=/tmp/current-index.html NEW_INDEX=/tmp/new-index.html DONE_PATH=/tmp/rotation-done.json nohup node tools/rotate-server.mjs > /tmp/rotate-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8790/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rotate-server.log
          exit 1
      - name: Open temporary HTTPS tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8790 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          URL=''
          for i in {1..90}; do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { cat /tmp/cloudflared.log; exit 1; }
          TOKEN=$(cat /tmp/rotate-token)
          printf '%s/rotate?token=%s\n' "$URL" "$TOKEN" > rotation-url.txt
          echo 'One-time password rotation URL is ready.'
      - name: Upload one-time rotation URL
        uses: actions/upload-artifact@v4
        with:
          name: sku-password-rotation-url
          path: rotation-url.txt
          retention-days: 1
      - name: Wait for encrypted rotation submission
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..180}; do
            if [ -s /tmp/rotation-done.json ] && [ -s /tmp/new-index.html ]; then
              cat /tmp/rotation-done.json
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for password rotation.'
          exit 1
      - name: Validate and persist new encrypted envelope
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '声光漏水报警器' /tmp/new-index.html
          ! grep -q '手动抽芯铆钉枪' /tmp/new-index.html
          grep -q 'const ENCRYPTED_PAYLOAD=' /tmp/new-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('/tmp/new-index.html').read_text()
          m=re.search(r'const ENCRYPTED_PAYLOAD=(\{.*?\});\s*let data=',s,re.S)
          if not m: raise SystemExit('new envelope missing')
          env=json.loads(m.group(1))
          if set(env)!={'salt','iv','cipher','iterations','aad'}: raise SystemExit('invalid envelope fields')
          Path('sku-pwa-auth-src/envelope.json').write_text(json.dumps(env,separators=(',',':')))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sku-pwa-auth-src/envelope.json
          git commit -m 'Persist rotated PWA access envelope'
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$SOURCE_SHA" > /tmp/source-sha.txt
          git push origin HEAD:refs/heads/sku-pwa-auth-test
      - name: Wait for standard QA publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(cat /tmp/source-sha.txt)
          RUN_ID=''
          for i in {1..60}; do
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=20" --jq '.workflow_runs[] | select(.path==".github/workflows/sku-pwa-auth.yml") | .id' | head -1 || true)
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          [ -n "$RUN_ID" ] || { echo 'standard publish run not found'; exit 1; }
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          git fetch origin sku-pwa-auth-public:refs/remotes/origin/sku-pwa-auth-public --force
          NEW_SHA=$(git rev-parse refs/remotes/origin/sku-pwa-auth-public)
          printf '%s\n' "$NEW_SHA" > /tmp/new-sha.txt
          printf 'https://cdn.githubraw.com/%s/%s/index.html\n' "$GITHUB_REPOSITORY" "$NEW_SHA" > /tmp/new-url.txt
      - name: Verify new public build uses persisted envelope
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/new-url.txt)
          READY=0
          for i in {1..60}; do
            if curl -fsSL "$URL" -o /tmp/public-index.html; then
              if grep -q 'SKU 选品决策驾驶舱' /tmp/public-index.html; then READY=1; break; fi
            fi
            sleep 3
          done
          [ "$READY" = '1' ]
          grep -q 'const ENCRYPTED_PAYLOAD=' /tmp/public-index.html
          ! grep -q '声光漏水报警器' /tmp/public-index.html
          ! grep -q '手动抽芯铆钉枪' /tmp/public-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          expected=json.loads(Path('sku-pwa-auth-src/envelope.json').read_text())
          s=Path('/tmp/public-index.html').read_text()
          m=re.search(r'const ENCRYPTED_PAYLOAD=(\{.*?\});\s*let data=',s,re.S)
          if not m: raise SystemExit('public envelope missing')
          actual=json.loads(m.group(1))
          if actual!=expected: raise SystemExit('rotated envelope not preserved')
          print('rotated envelope preserved')
          PY
          cat /tmp/new-url.txt
      - name: Upload rotation completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: sku-password-rotation-complete
          path: |
            /tmp/new-url.txt
            /tmp/new-sha.txt
            /tmp/source-sha.txt
            /tmp/rotation-done.json
          retention-days: 7
