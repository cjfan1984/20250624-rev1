name: LEGACY - SKU PWA V4 Data Fragments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sku-pwa-v4-data-fragments
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sku-pwa-auth-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 9/9 encrypted data fragments and version
        run: |
          set -euo pipefail
          python sku-pwa-auth-tools/make_v4_fragments.py | tee v4-fragments.json
          test -s sku-pwa-auth-data/pwa-data-version.json
          for i in 01 02 03 04 05 06 07 08 09; do test -s "sku-pwa-auth-data/sku-data.part${i}"; done
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          parts=[Path(f'sku-pwa-auth-data/sku-data.part{i:02d}').read_text() for i in range(1,10)]
          text=''.join(parts); env=json.loads(text); version=json.loads(Path('sku-pwa-auth-data/pwa-data-version.json').read_text())
          assert env['kind']=='SKU-PWA-HYBRID-ENVELOPE'
          assert env['records']==version['records']
          assert hashlib.sha256(text.encode()).hexdigest()==version['envelopeSha256']
          assert version['fragmentCount']==9
          print('V4_FRAGMENT_QA=PASS',env['records'],version['version'])
          PY
      - name: Commit generated V4 data files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sku-pwa-auth-data/sku-data.part01 sku-pwa-auth-data/sku-data.part02 sku-pwa-auth-data/sku-data.part03 sku-pwa-auth-data/sku-data.part04 sku-pwa-auth-data/sku-data.part05 sku-pwa-auth-data/sku-data.part06 sku-pwa-auth-data/sku-data.part07 sku-pwa-auth-data/sku-data.part08 sku-pwa-auth-data/sku-data.part09 sku-pwa-auth-data/pwa-data-version.json
          if git diff --cached --quiet; then
            echo 'V4 fragments already current'
            exit 0
          fi
          git commit -m 'Complete V4 encrypted SKU data 9/9'
          git push origin HEAD:sku-pwa-auth-test
