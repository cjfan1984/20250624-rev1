name: SKU PWA Auth QA and Publish

on:
  push:
    branches: [sku-pwa-auth-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sku-pwa-auth-cdn
  cancel-in-progress: true

env:
  CI_AUTH_TEST_PASSWORD: "CI-Test#SKU31-2026"

jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct encrypted production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sku-pwa-auth/icons
          cat \
            sku-pwa-auth-src/index.part01 \
            sku-pwa-auth-src/index.part02 \
            sku-pwa-auth-src/index.part03 \
            sku-pwa-auth-src/index.part04 \
            sku-pwa-auth-src/index.part05 \
            sku-pwa-auth-src/index.part06 \
            sku-pwa-auth-src/index.part07 \
            sku-pwa-auth-src/index.part08 \
            sku-pwa-auth-src/index.part09 \
            > sku-pwa-auth/index.html
          cat \
            sku-pwa-auth-src/full-envelope.part01 \
            sku-pwa-auth-src/full-envelope.part02 \
            sku-pwa-auth-src/full-envelope.part03 \
            sku-pwa-auth-src/full-envelope.part04a \
            sku-pwa-auth-src/full-envelope.part04b \
            > /tmp/full-envelope.json
          cp sku-pwa-auth-src/hybrid-keyring.json /tmp/hybrid-keyring.json
          cp sku-pwa-auth-src/manifest.webmanifest sku-pwa-auth/manifest.webmanifest
          cp sku-pwa-auth-src/sw.js sku-pwa-auth/sw.js
          base64 -d sku-pwa-src/icon-180.b64 > sku-pwa-auth/icons/icon-180.png
          base64 -d sku-pwa-src/icon-192.b64 > sku-pwa-auth/icons/icon-192.png
          base64 -d sku-pwa-src/icon-512.b64 > sku-pwa-auth/icons/icon-512.png
          touch sku-pwa-auth/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('sku-pwa-auth/index.html')
          s=p.read_text()
          env=json.loads(Path('/tmp/full-envelope.json').read_text())
          keyring=json.loads(Path('/tmp/hybrid-keyring.json').read_text())
          if keyring.get('kind')!='SKU-PWA-HYBRID-KEYRING': raise SystemExit('invalid hybrid keyring')
          public=keyring.get('publicKey',{})
          wrapped_private=keyring.get('wrappedPrivateKey',{})
          if not {'data','fingerprintSha256'}.issubset(public): raise SystemExit('hybrid public key missing')
          if not {'salt','iv','aad','ciphertext','iterations'}.issubset(wrapped_private): raise SystemExit('wrapped private key missing')
          if env.get('kind')=='SKU-PWA-HYBRID-ENVELOPE':
              if env.get('compression')!='gzip': raise SystemExit('hybrid envelope must be gzip')
              if not isinstance(env.get('records'),int) or env['records']<1: raise SystemExit('hybrid record count missing')
              data_enc=env.get('dataEncryption',{})
              key_wrap=env.get('keyWrapping',{})
              if not {'iv','aad','ciphertext'}.issubset(data_enc): raise SystemExit('hybrid data encryption fields missing')
              if not {'wrappedKey','publicKeyFingerprintSha256'}.issubset(key_wrap): raise SystemExit('hybrid wrapped key missing')
              if key_wrap['publicKeyFingerprintSha256']!=public['fingerprintSha256']: raise SystemExit('hybrid fingerprint mismatch')
          else:
              required={'salt','iv','cipher','iterations','aad'}
              if not required.issubset(env): raise SystemExit('invalid legacy envelope fields')
              if env.get('compressed')!='gzip': raise SystemExit('legacy envelope must be gzip')
          key_literal=json.dumps(keyring,separators=(',',':'))
          marker='const HYBRID_KEYRING=__HYBRID_KEYRING__;'
          if s.count(marker)!=1: raise SystemExit('hybrid keyring overlay marker missing')
          s=s.replace(marker,'const HYBRID_KEYRING='+key_literal+';',1)
          literal=json.dumps(env,separators=(',',':'))
          out,n=re.subn(r'const ENCRYPTED_PAYLOAD=\{.*?\};\s*let data=', 'const ENCRYPTED_PAYLOAD='+literal+';\nlet data=', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('payload overlay failed')
          p.write_text(out)
          print('full-library envelope overlaid', env.get('kind','legacy'), env.get('records','unknown'))
          PY

      - name: Verify encrypted-at-rest source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ENCRYPTED_PAYLOAD' sku-pwa-auth/index.html
          ! grep -q '声光漏水报警器' sku-pwa-auth/index.html
          ! grep -q '手动抽芯铆钉枪' sku-pwa-auth/index.html
          grep -q 'authScreen' sku-pwa-auth/index.html
          grep -q 'decryptPayload' sku-pwa-auth/index.html
          grep -q 'decryptHybridPayload' sku-pwa-auth/index.html
          grep -q 'SKU-PWA-HYBRID-KEYRING' sku-pwa-auth/index.html
          grep -q '竞品差评洞察' sku-pwa-auth/index.html
          grep -q '人工刷新' sku-pwa-auth/index.html
          test -s /tmp/full-envelope.json

      - name: Build CI-only decryptable auth test site
        shell: bash
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          from pathlib import Path
          import re,json,base64,os,gzip,hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          old=''.join(Path(f'sku-pwa-src/index.part{i:02d}').read_text() for i in range(1,7))
          m=re.search(r'const data=(\[.*?\]);\s*let sorted=',old,re.S)
          if not m: raise SystemExit('legacy CI source payload missing')
          raw=m.group(1); payload=json.loads(raw)
          password=os.environ['CI_AUTH_TEST_PASSWORD'].encode()
          b64=lambda b:base64.b64encode(b).decode()
          iterations=310000; keyring_aad=b'SKU-PWA-HYBRID-KEYRING-V1'; data_aad=b'SKU-PWA-HYBRID-DATA-V1'
          private=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          public_der=private.public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)
          private_der=private.private_bytes(serialization.Encoding.DER,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())
          fingerprint=hashlib.sha256(public_der).hexdigest(); salt=os.urandom(16); private_iv=os.urandom(12)
          password_key=PBKDF2HMAC(algorithm=hashes.SHA256(),length=32,salt=salt,iterations=iterations).derive(password)
          wrapped_private=AESGCM(password_key).encrypt(private_iv,private_der,keyring_aad)
          keyring={'version':1,'kind':'SKU-PWA-HYBRID-KEYRING','publicKey':{'algorithm':'RSA-OAEP-3072-SHA256','format':'SPKI-DER','encoding':'base64','data':b64(public_der),'fingerprintSha256':fingerprint},'wrappedPrivateKey':{'format':'PKCS8-DER','encoding':'base64','kdf':'PBKDF2-HMAC-SHA256','iterations':iterations,'salt':b64(salt),'cipher':'AES-256-GCM','iv':b64(private_iv),'aad':keyring_aad.decode(),'ciphertext':b64(wrapped_private)}}
          data_key=os.urandom(32); data_iv=os.urandom(12); packed=gzip.compress(json.dumps(payload,separators=(',',':')).encode(),compresslevel=9,mtime=0)
          cipher=AESGCM(data_key).encrypt(data_iv,packed,data_aad)
          wrapped_key=private.public_key().encrypt(data_key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          enc={'version':1,'kind':'SKU-PWA-HYBRID-ENVELOPE','records':len(payload),'payloadSchema':'SKU-PRODUCT-CARD-CI','compression':'gzip','contentType':'application/json; charset=utf-8','dataEncryption':{'algorithm':'AES-256-GCM','iv':b64(data_iv),'aad':data_aad.decode(),'ciphertext':b64(cipher)},'keyWrapping':{'algorithm':'RSA-OAEP-3072-SHA256','wrappedKey':b64(wrapped_key),'publicKeyFingerprintSha256':fingerprint}}
          prod=Path('sku-pwa-auth/index.html').read_text()
          prod=re.sub(r'const ENCRYPTED_PAYLOAD=\{.*?\};\s*let data=', 'const ENCRYPTED_PAYLOAD='+json.dumps(enc,separators=(',',':'))+';\nlet data=',prod,count=1,flags=re.S)
          prod,n=re.subn(r'const HYBRID_KEYRING=.*?;\s*const b64bytes=', 'const HYBRID_KEYRING='+json.dumps(keyring,separators=(',',':'))+';\nconst b64bytes=',prod,count=1,flags=re.S)
          if n!=1: raise SystemExit('CI hybrid keyring overlay failed')
          d=Path('/tmp/auth-test-site');(d/'icons').mkdir(parents=True,exist_ok=True)
          (d/'index.html').write_text(prod)
          for f in ['manifest.webmanifest','sw.js']:(d/f).write_bytes(Path('sku-pwa-auth',f).read_bytes())
          for f in ['icon-180.png','icon-192.png','icon-512.png']:(d/'icons'/f).write_bytes(Path('sku-pwa-auth/icons',f).read_bytes())
          PY

      - name: Diagnose production envelope password separation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,os,gzip
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          env=json.loads(Path('/tmp/full-envelope.json').read_text())
          keyring=json.loads(Path('/tmp/hybrid-keyring.json').read_text())
          try:
              password=os.environ['CI_AUTH_TEST_PASSWORD'].encode()
              if env.get('kind')=='SKU-PWA-HYBRID-ENVELOPE':
                  wrapped=keyring['wrappedPrivateKey']
                  key=PBKDF2HMAC(algorithm=hashes.SHA256(),length=32,salt=base64.b64decode(wrapped['salt']),iterations=wrapped['iterations']).derive(password)
                  AESGCM(key).decrypt(base64.b64decode(wrapped['iv']),base64.b64decode(wrapped['ciphertext']),wrapped['aad'].encode())
              else:
                  key=PBKDF2HMAC(algorithm=hashes.SHA256(),length=32,salt=base64.b64decode(env['salt']),iterations=env['iterations']).derive(password)
                  AESGCM(key).decrypt(base64.b64decode(env['iv']),base64.b64decode(env['cipher']),env['aad'].encode())
              raise SystemExit('CI password unexpectedly decrypts production credentials')
          except Exception:
              print('PRODUCTION_ENVELOPE_CI_PASSWORD_MATCH=false')
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start CI auth test server
        shell: bash
        run: |
          nohup python3 -m http.server 4174 --directory /tmp/auth-test-site > auth-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat auth-server.log; exit 1

      - name: Real browser password, product-card, lock and offline QA
        env:
          PWA_URL: http://127.0.0.1:4174/index.html
          AUTH_TEST_PASSWORD: ${{ env.CI_AUTH_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tests-pwa-auth/auth-browser.mjs | tee auth-ci-qa.json

      - name: Publish production encrypted build to clean branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sku-pwa-auth-public-build /tmp/sku-pwa-auth-public-worktree
          mkdir -p /tmp/sku-pwa-auth-public-build
          cp -a sku-pwa-auth/. /tmp/sku-pwa-auth-public-build/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sku-pwa-auth-public:refs/remotes/origin/sku-pwa-auth-public || true
          git worktree add -B sku-pwa-auth-public-publish /tmp/sku-pwa-auth-public-worktree origin/sku-pwa-auth-public
          find /tmp/sku-pwa-auth-public-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sku-pwa-auth-public-build/. /tmp/sku-pwa-auth-public-worktree/
          cd /tmp/sku-pwa-auth-public-worktree
          git add -A
          if git diff --cached --quiet; then
            PUBLISH_SHA=$(git rev-parse HEAD)
            echo "No encrypted PWA changes; retaining public commit: $PUBLISH_SHA"
          else
            git commit -m "Publish encrypted full-library SKU PWA"
            PUBLISH_SHA=$(git rev-parse HEAD)
            git push --force origin HEAD:refs/heads/sku-pwa-auth-public
          fi
          printf '%s\n' "$PUBLISH_SHA" > /tmp/auth-publish-sha.txt
          echo "Published auth commit: $PUBLISH_SHA"

      - name: Verify public encrypted PWA lock screen and envelope continuity
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/auth-publish-sha.txt)
          URL="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/${SHA}/index.html"
          echo "$URL" | tee auth-pwa-url.txt
          READY=0
          for i in {1..36}; do
            if curl -fsSL --connect-timeout 8 -D auth-index-headers.txt "$URL" > auth-public-index.html 2>auth-curl.err; then
              if grep -q 'SKU 选品决策驾驶舱' auth-public-index.html; then READY=1; break; fi
            fi
            sleep 5
          done
          [ "$READY" = "1" ] || { cat auth-curl.err; exit 1; }
          grep -qi 'content-type: text/html' auth-index-headers.txt
          ! grep -q '声光漏水报警器' auth-public-index.html
          ! grep -q '手动抽芯铆钉枪' auth-public-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          expected=json.loads(Path('/tmp/full-envelope.json').read_text())
          expected_keyring=json.loads(Path('/tmp/hybrid-keyring.json').read_text())
          s=Path('auth-public-index.html').read_text()
          m=re.search(r'const ENCRYPTED_PAYLOAD=(\{.*?\});\s*let data=',s,re.S)
          if not m: raise SystemExit('public envelope missing')
          actual=json.loads(m.group(1))
          if actual!=expected: raise SystemExit('public envelope drifted')
          km=re.search(r'const HYBRID_KEYRING=(\{.*?\});\s*const b64bytes=',s,re.S)
          if not km: raise SystemExit('public hybrid keyring missing')
          if json.loads(km.group(1))!=expected_keyring: raise SystemExit('public hybrid keyring drifted')
          print('public full-library envelope and hybrid keyring continuity verified')
          PY
          BASE="${URL%/index.html}"
          curl -fsSL -D auth-manifest-headers.txt "$BASE/manifest.webmanifest" -o auth-public-manifest.webmanifest
          curl -fsSL -D auth-sw-headers.txt "$BASE/sw.js" -o auth-public-sw.js
          test -s auth-public-manifest.webmanifest
          test -s auth-public-sw.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('auth-public-manifest.webmanifest').read_text())
          if not isinstance(manifest,dict): raise SystemExit('manifest is not JSON object')
          if not manifest.get('name') and not manifest.get('short_name'): raise SystemExit('manifest name missing')
          print('public manifest JSON verified')
          PY
          grep -Fq 'const BUILD_TOKEN=' auth-public-sw.js
          grep -Fq 'sku-decision-auth-v1-6-' auth-public-sw.js
          grep -Fq "fresh.searchParams.set('_pwa'" auth-public-sw.js
          grep -Fq 'ensureChatGptBridge' auth-public-sw.js
          grep -Fq '复制并打开ChatGPT' auth-public-sw.js
          PWA_URL="$URL" node tests-pwa-auth/auth-public-browser.mjs | tee auth-public-qa.json
          STABLE_READY=0
          for i in {1..36}; do
            STABLE_URL="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/sku-pwa-auth-public/index.html?_pwa=${SHA}-${i}"
            if curl -fsSL --connect-timeout 8 -D auth-stable-headers.txt "$STABLE_URL" > auth-stable-index.html \
              && grep -Fq 'v1-6-' auth-stable-index.html; then
              STABLE_READY=1
              break
            fi
            sleep 5
          done
          [ "$STABLE_READY" = "1" ] || { echo 'stable index did not expose current cache-migration code'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          expected=json.loads(Path('/tmp/full-envelope.json').read_text())
          expected_keyring=json.loads(Path('/tmp/hybrid-keyring.json').read_text())
          s=Path('auth-stable-index.html').read_text()
          m=re.search(r'const ENCRYPTED_PAYLOAD=(\{.*?\});\s*let data=',s,re.S)
          if not m: raise SystemExit('stable PWA envelope missing')
          if json.loads(m.group(1))!=expected: raise SystemExit('stable PWA cache did not refresh')
          km=re.search(r'const HYBRID_KEYRING=(\{.*?\});\s*const b64bytes=',s,re.S)
          if not km: raise SystemExit('stable PWA hybrid keyring missing')
          if json.loads(km.group(1))!=expected_keyring: raise SystemExit('stable PWA keyring cache did not refresh')
          print('stable branch cache-busted PWA and hybrid keyring verified')
          PY
          STABLE_SW_READY=0
          for i in {1..36}; do
            STABLE_SW_URL="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/sku-pwa-auth-public/sw.js?_pwa=${SHA}-${i}"
            if curl -fsSL --connect-timeout 8 "$STABLE_SW_URL" > auth-stable-sw.js \
              && grep -Fq 'const BUILD_TOKEN=' auth-stable-sw.js \
              && grep -Fq 'sku-decision-auth-v1-6-' auth-stable-sw.js \
              && grep -Fq 'ensureChatGptBridge' auth-stable-sw.js \
              && grep -Fq '复制并打开ChatGPT' auth-stable-sw.js; then
              STABLE_SW_READY=1
              break
            fi
            sleep 5
          done
          [ "$STABLE_SW_READY" = "1" ] || { echo 'stable service worker did not expose current cache code'; exit 1; }

      - name: Upload auth PWA evidence
        uses: actions/upload-artifact@v4
        with:
          name: sku-pwa-auth-final
          path: |
            auth-pwa-url.txt
            auth-ci-qa.json
            auth-public-qa.json
            auth-stable-index.html
            auth-stable-sw.js
            auth-stable-headers.txt
            auth-login-mobile.png
            auth-app-mobile.png
            auth-public-login.png
            auth-index-headers.txt
            auth-manifest-headers.txt
            auth-sw-headers.txt
          retention-days: 7
