name: SKU PWA QA and CDN Publish

on:
  push:
    branches: [sku-pwa-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sku-pwa-cdn
  cancel-in-progress: true

jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact PWA build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sku-pwa/icons
          cat \
            sku-pwa-src/index.part01 \
            sku-pwa-src/index.part02 \
            sku-pwa-src/index.part03 \
            sku-pwa-src/index.part04 \
            sku-pwa-src/index.part05 \
            sku-pwa-src/index.part06 \
            > sku-pwa/index.html
          cp sku-pwa-src/manifest.webmanifest sku-pwa/manifest.webmanifest
          cp sku-pwa-src/sw.js sku-pwa/sw.js
          base64 -d sku-pwa-src/icon-180.b64 > sku-pwa/icons/icon-180.png
          base64 -d sku-pwa-src/icon-192.b64 > sku-pwa/icons/icon-192.png
          base64 -d sku-pwa-src/icon-512.b64 > sku-pwa/icons/icon-512.png
          touch sku-pwa/.nojekyll
          echo "c9ec9fe3a1251b8856457de951d923cfba1d881b4910e35de3405dacd6ceb04c  sku-pwa/index.html" | sha256sum -c -

      - name: Verify frozen 31-SKU golden data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          text = Path('sku-pwa/index.html').read_text(encoding='utf-8')
          m = re.search(r'const data=(\[.*?\]);\s*let sorted=', text, re.S)
          if not m:
              raise SystemExit('Golden data payload not found')
          raw = m.group(1)
          digest = hashlib.sha256(raw.encode()).hexdigest()
          expected = '032f1f27a7188b59d629968dd4d76431812400893333ee641dd9cc0188425df2'
          if digest != expected:
              raise SystemExit(f'Golden data changed: {digest}')
          data = json.loads(raw)
          assert len(data) == 31
          assert data[0]['sku'] == '声光漏水报警器'
          assert data[1]['sku'] == '3.6×150mm 100条黑色'
          assert max(data, key=lambda x:x['profit'])['sku'] == '手动抽芯铆钉枪'
          print(json.dumps({'goldenHash':digest,'skuCount':31}, ensure_ascii=False))
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local PWA test server
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory sku-pwa > pwa-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat pwa-server.log
          exit 1

      - name: Real mobile browser and offline QA
        env:
          PWA_URL: http://127.0.0.1:4173/
        run: node tests-pwa/pwa-browser.mjs | tee pwa-local-qa.json

      - name: Publish verified build to clean sku-pwa-public branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sku-pwa-public-build /tmp/sku-pwa-public-worktree
          mkdir -p /tmp/sku-pwa-public-build
          cp -a sku-pwa/. /tmp/sku-pwa-public-build/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sku-pwa-public:refs/remotes/origin/sku-pwa-public
          git worktree add -B sku-pwa-public-publish /tmp/sku-pwa-public-worktree origin/sku-pwa-public
          find /tmp/sku-pwa-public-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sku-pwa-public-build/. /tmp/sku-pwa-public-worktree/
          cd /tmp/sku-pwa-public-worktree
          git add -A
          git commit -m "Publish verified 31-SKU PWA" || true
          git push --force origin HEAD:refs/heads/sku-pwa-public

      - name: Verify public CDN PWA with real browser
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          CANDIDATES=(
            "https://cdn.jsdelivr.net/gh/${REPO}@sku-pwa-public/index.html"
            "https://raw.githack.com/${REPO}/sku-pwa-public/index.html"
          )
          : > cdn-attempts.log
          OK=0
          for URL in "${CANDIDATES[@]}"; do
            echo "Testing $URL" | tee -a cdn-attempts.log
            READY=0
            for i in {1..36}; do
              if curl -fsSL --connect-timeout 8 "$URL" > public-index.html 2>public-curl.err; then
                if grep -q '31 SKU 选品决策驾驶舱' public-index.html; then READY=1; break; fi
              fi
              sleep 5
            done
            if [ "$READY" != "1" ]; then
              cat public-curl.err >> cdn-attempts.log || true
              continue
            fi
            if PWA_URL="$URL" node tests-pwa/pwa-browser.mjs > pwa-public-qa.json 2>pwa-public-qa.err; then
              echo "$URL" | tee pwa-url.txt
              cat pwa-public-qa.json
              OK=1
              break
            fi
            cat pwa-public-qa.err >> cdn-attempts.log || true
          done
          if [ "$OK" != "1" ]; then
            cat cdn-attempts.log
            exit 1
          fi

      - name: Upload final PWA evidence
        uses: actions/upload-artifact@v4
        with:
          name: sku-pwa-final
          path: |
            pwa-url.txt
            pwa-local-qa.json
            pwa-public-qa.json
            pwa-mobile.png
            pwa-desktop.png
            cdn-attempts.log
          retention-days: 7
