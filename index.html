<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全库 SKU 选品产品卡</title>
<meta name="theme-color" content="#13233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SKU决策">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">

<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--good:#0f9f6e;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;--soft:#eef4ff;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:18px} .hero{background:linear-gradient(135deg,#13233f,#203c67);color:#fff;border-radius:22px;padding:22px}
.hero h1{margin:0 0 8px;font-size:24px} .hero p{margin:0;color:#dbeafe;font-size:13px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px} .kpi{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px}
.kpi b{font-size:23px;display:block} .kpi span{font-size:12px;color:#dbeafe}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0} select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px}
.toggle{display:flex;gap:6px} .toggle button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(15,23,42,.06)} 
.titleline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px} h2{margin:0;font-size:21px;line-height:1.35} .family{font-size:12px;color:var(--muted);margin-top:5px}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap} .good{background:#dcfce7;color:#067647} .warn{background:#fff7ed;color:#b45309} .bad{background:#fee2e2;color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px} .metric{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fafafa}
.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px} .metric strong{font-size:18px} .metric .sub{font-size:11px;color:var(--muted);margin-top:4px}
.spec{margin-top:14px;padding:12px;background:#f8fafc;border-radius:14px;font-size:13px;line-height:1.65}
.links{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px} .links a{text-decoration:none;text-align:center;padding:11px 8px;border-radius:12px;font-weight:700;font-size:13px;border:1px solid #cbd5e1;background:#fff;color:#1e3a5f}
.links a:hover{background:var(--soft);border-color:#93c5fd} .links a:nth-child(4),.links a:nth-child(5){background:#eff6ff}
.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:12px}
.ranking{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;overflow:auto} table{width:100%;border-collapse:collapse;min-width:850px} th,td{padding:9px;border-bottom:1px solid #eef2f7;text-align:left;font-size:12px} th{color:#64748b;background:#f8fafc;position:sticky;top:0} tr{cursor:pointer} tr:hover{background:#f8fbff}
.pos{color:#067647;font-weight:700} .neg{color:#b91c1c;font-weight:700}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.links{grid-template-columns:repeat(2,1fr)}.links a:last-child{grid-column:1/-1}}

/* PWA/mobile stability additions: preserve original UI, improve touch only */
button,select,a{-webkit-tap-highlight-color:transparent} button,select{min-height:44px}
.install-tip{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:#172033;color:white;border-radius:14px;padding:11px 38px 11px 13px;font-size:12px;line-height:1.45;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.install-tip button{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#fff;font-size:18px;min-height:28px;padding:0 7px}
@media(max-width:760px){.wrap{padding:10px}.hero{padding:16px;border-radius:18px}.hero h1{font-size:20px}.toggle{display:grid;grid-template-columns:repeat(3,1fr)}.toggle button{padding:8px 6px;font-size:12px}.card{padding:14px}.metric strong{font-size:16px}.ranking{padding:10px;border-radius:16px}.links a{min-height:44px;display:flex;align-items:center;justify-content:center}}

.auth-screen{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#eef3fa,#f8fafc);display:flex;align-items:center;justify-content:center;padding:22px}
.auth-card{width:min(92vw,390px);background:#fff;border:1px solid #dbe3ee;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.13)}
.auth-mark{width:52px;height:52px;border-radius:15px;background:#13233f;color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:16px}
.auth-card h1{font-size:22px;margin:0 0 7px}.auth-card p{margin:0 0 18px;color:#667085;font-size:12px;line-height:1.6}
.auth-field{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.auth-card input{width:100%;min-height:48px;border:1px solid #cfd8e6;border-radius:12px;padding:11px 12px;font-size:16px;outline:none}.auth-card input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.auth-card .login-btn{width:100%;margin-top:10px;min-height:48px;border:0;border-radius:12px;background:#1f5bd8;color:#fff;font-weight:800;font-size:15px}.auth-card .login-btn:disabled{opacity:.6}
.auth-error{min-height:20px;margin-top:8px;color:#b91c1c;font-size:12px}.auth-foot{border-top:1px solid #eef2f6;margin-top:10px;padding-top:10px;color:#667085;font-size:11px;line-height:1.55}
.lock-btn{float:right;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);color:white;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;min-height:38px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <form id="authForm" class="auth-card" autocomplete="off">
    <div class="auth-mark">🔐</div>
    <h1>SKU 选品决策驾驶舱</h1>
    <p>受保护数据。请输入访问密码后在本机解密，密码不会上传到服务器。</p>
    <label class="auth-field" for="authPassword">访问密码</label>
    <input id="authPassword" type="password" inputmode="text" autocomplete="current-password" placeholder="请输入密码" required>
    <button id="loginBtn" class="login-btn" type="submit">登录</button>
    <div id="authError" class="auth-error" role="alert"></div>
    <div class="auth-foot">全库SKU数据已加密存储。关闭或重新加载页面后需要重新输入密码。</div>
  </form>
</div>
<div class="wrap" id="appRoot" hidden>
<button id="lockBtn" class="lock-btn" type="button">🔒 锁定</button>
<div class="hero"><h1>全库 SKU 选品决策驾驶舱</h1><p>全库产品卡 → 净利润排名 → 数据闭环 → 竞品差评 → 货源与竞品链接。记录数在解密后按当前数据动态显示。</p>
<div class="kpis"><div class="kpi"><b>—</b><span>全库产品卡</span></div><div class="kpi"><b>—</b><span>可参与净利润排名</span></div><div class="kpi"><b>—</b><span>净利率≥15%</span></div><div class="kpi"><b>—</b><span>候选待补 / STOP</span></div></div></div>
<div class="toolbar"><select id="skuSelect"></select><div class="toggle"><button onclick="sortBy('margin')">按净利率</button><button onclick="sortBy('profit')">按单件利润</button><button onclick="sortBy('month')">按月利润</button></div></div>
<div id="detail"></div>
<div class="ranking"><table><thead><tr><th>排名</th><th>SKU</th><th>售价</th><th>实际/情景成本</th><th>目标成本</th><th>单件利润</th><th>净利率</th><th>预计月单量</th><th>月利润代理值</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<div id="installTip" class="install-tip">在 Safari 点“分享” → “添加到主屏幕”，以后可像 App 一样打开。<button aria-label="关闭" onclick="this.parentElement.style.display='none';localStorage.setItem('pwaTipHidden','1')">×</button></div>
<script>
let ENCRYPTED_PAYLOAD=null;
let PWA_DATA_VERSION=null;
let PWA_DATA_READY=null;
async function loadExternalEncryptedPayload(){
  const loginBtn=document.getElementById('loginBtn');
  const authError=document.getElementById('authError');
  if(loginBtn){loginBtn.disabled=true;loginBtn.textContent='加载数据…';}
  try{
    const versionUrl=new URL('./pwa-data-version.json',window.location.href);
    const vr=await fetch(versionUrl.toString(),{cache:'no-store'});
    if(!vr.ok)throw new Error(`version HTTP ${vr.status}`);
    const meta=await vr.json();
    if(!meta||!Number.isInteger(meta.records)||meta.records<1)throw new Error('version records invalid');
    const dataUrl=new URL('./sku-data.enc.json',window.location.href);
    const dr=await fetch(dataUrl.toString(),{cache:'no-store'});
    if(!dr.ok)throw new Error(`data HTTP ${dr.status}`);
    const env=await dr.json();
    if(!env||env.kind!=='SKU-PWA-HYBRID-ENVELOPE')throw new Error('encrypted data kind invalid');
    if(env.records!==meta.records)throw new Error(`record mismatch ${env.records}/${meta.records}`);
    ENCRYPTED_PAYLOAD=env;
    PWA_DATA_VERSION=meta;
    window.PWA_DATA_VERSION=meta;
    if(loginBtn){loginBtn.disabled=false;loginBtn.textContent='登录';}
    if(authError)authError.textContent='';
    return env;
  }catch(err){
    if(loginBtn){loginBtn.disabled=true;loginBtn.textContent='数据加载失败';}
    if(authError)authError.textContent='加密数据包加载失败；联网后点人工刷新，离线时会尝试使用上次缓存。';
    console.error('PWA external data load failed',err);
    throw err;
  }
}
const authFormForData=document.getElementById('authForm');
if(authFormForData){authFormForData.addEventListener('submit',event=>{if(!ENCRYPTED_PAYLOAD){event.preventDefault();event.stopImmediatePropagation();}},true);}
PWA_DATA_READY=loadExternalEncryptedPayload();
window.PWA_DATA_READY=PWA_DATA_READY;
let data=[];
let sorted=[];
const money=n=>(n>=0?'¥':'-¥')+Math.abs(n).toFixed(2);
const pct=n=>n.toFixed(1)+'%';
const rub=n=>'₽'+Math.round(n).toLocaleString();
const range=a=>a[0]===a[1]?String(a[0]):a[0]+'–'+a[1];
function badge(d){if(d.margin>=20)return ['达到20%目标','good']; if(d.margin>=15)return ['15%–20%','warn']; if(d.profit>=0)return ['低于15%','warn']; return ['负利润','bad'];}
function renderSelect(){
 const s=document.getElementById('skuSelect'); const current=s.value; s.innerHTML='';
 sorted.forEach((d,i)=>{const o=document.createElement('option');o.value=d.rank;o.textContent=`${i+1}｜${d.sku}｜${pct(d.margin)}`;s.appendChild(o)});
 if(current && [...s.options].some(o=>o.value===current))s.value=current; else s.value=sorted[0].rank;
 s.onchange=()=>renderDetail(Number(s.value));
}

const DASHBOARD_VERSION_DATE='2026-08-28';
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const known=(d,k)=>Boolean(d && d[k]);
const fmtMoney=(v,ok=true)=>ok?`¥${num(v).toFixed(2)}`:'待补';
const fmtRub=(v,ok=true)=>ok?`${Math.round(num(v)).toLocaleString()} RUB`:'待补';
const fmtPct=(v,ok=true)=>ok?`${num(v).toFixed(1)}%`:'待补';
const fmtKg=(v,ok=true)=>ok?`${num(v).toFixed(3)} kg`:'待补';
const safeText=v=>(v===null||v===undefined||v===''||v==='待补/未闭环')?'待补':String(v);
const decisionOrPass=d=>known(d,'profitKnown')&&(num(d.profit)>10||num(d.margin)>15);
const rankEligible=d=>decisionOrPass(d)&&d.profitRankEligible!==false&&d.stage!=='STOP'&&d.pwaTier!=='STOP_AUDIT'&&d.pwaTier!=='CANDIDATE_PENDING';
const profitScore=d=>rankEligible(d)?num(d.profit):-1e15;
const marginScore=d=>rankEligible(d)?num(d.margin):-1e15;
function normalizeRow(d){const x={...d};['rank','price','cost','weight','cel','profit','margin','targetCost','ozonUnits','wbOrders','wbSearch','packageL','packageW','packageH','chargeWeight'].forEach(k=>x[k]=num(x[k]));x.links=x.links||{};x.ozForecast=Array.isArray(x.ozForecast)?x.ozForecast:[0,0];x.wbForecast=Array.isArray(x.wbForecast)?x.wbForecast:[0,0];x.totalForecast=Array.isArray(x.totalForecast)?x.totalForecast:[0,0];x.linkStatus=x.linkStatus||{};return x;}
function isStandaloneMode(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
async function copyExternalText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){return false;}}
function openPlatformLink(event,platform,url,sku){if(event)event.preventDefault();if(!url)return false;if(isStandaloneMode()){window.location.href=url;return false;}window.open(url,'_blank','noopener,noreferrer');return false;}
function linkStatus(url,explicit){if(explicit)return explicit;if(!url)return '待补';return /\/search\/|search\.aspx|search_result|search\/\?text/i.test(url)?'搜索入口｜待核精确商品':'商品页｜仍需人工复核';}
function statusBadge(d){if(d.stage==='STOP')return ['STOP审计','bad'];if(d.pwaTier==='CANDIDATE_PENDING')return ['候选待补','warn'];if(!known(d,'profitKnown'))return ['利润待补','warn'];if(!decisionOrPass(d))return ['OR闸门未通过','bad'];if(num(d.profit)>10&&num(d.margin)>15)return ['利润/利润率双过','good'];if(num(d.profit)>10)return ['单件利润>¥10','good'];return ['净利率>15%','good'];}
function quality(d){if(known(d,'profitKnown') && d.linkStatus && !String(d.linkStatus.supply||'').includes('待'))return 'B';if(known(d,'profitKnown'))return 'B';return 'C';}
function packageText(d){if(d.packageL>0&&d.packageW>0&&d.packageH>0)return `${d.packageL}×${d.packageW}×${d.packageH} cm`;return '待补';}
function supplierText(d){const p=safeText(d.supplyPlatform);const m=(d.moq!==null&&d.moq!==undefined&&String(d.moq)!==''&&num(d.moq)>0)?`MOQ ${num(d.moq).toLocaleString()}`:'MOQ待补';return `${p}｜${m}`;}
function reviewText(d){const v=safeText(d.reviewInsights);return v==='待补'?'待抓取真实竞品评论':v;}
async function manualRefresh(){const btn=document.getElementById('refreshBtn');if(btn){btn.disabled=true;btn.textContent='刷新中…';}try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}finally{const u=new URL(window.location.href);u.searchParams.set('_refresh',Date.now().toString());window.location.replace(u.toString());}}
function updateKpis(){const ks=document.querySelectorAll('.kpi');const calc=data.filter(rankEligible);if(ks[0]){ks[0].querySelector('b').textContent=data.length;ks[0].querySelector('span').textContent='全库产品卡';}if(ks[1]){ks[1].querySelector('b').textContent=calc.length;ks[1].querySelector('span').textContent='可参与净利润排名';}if(ks[2]){ks[2].querySelector('b').textContent=calc.length;ks[2].querySelector('span').textContent='跨境OR规则通过';}if(ks[3]){ks[3].querySelector('b').textContent=data.length-calc.length;ks[3].querySelector('span').textContent='候选待补 / STOP';}}
function upgradeLabels(){document.title='全库 SKU 选品产品卡';const foot=document.querySelector('.auth-foot');if(foot)foot.textContent='全库SKU数据已加密存储。关闭或重新加载页面后需要重新输入密码。';const hh=document.querySelector('.hero h1');if(hh)hh.textContent=`全库 ${data.length} SKU 选品决策驾驶舱`;const hp=document.querySelector('.hero p');if(hp)hp.textContent='全库产品卡 → 净利润排名 → 数据闭环 → 竞品差评 → 货源与竞品链接。未闭环SKU也进入产品卡，但不伪造利润排名。';const th=document.querySelectorAll('.ranking th');const labels=['排名','SKU','优先级','Ozon售价','采购成本','单件净利润','净利率','数据状态','更新时间'];labels.forEach((x,i)=>{if(th[i])th[i].textContent=x});const btn=document.querySelectorAll('.toggle button');if(btn[0])btn[0].textContent='按净利率';if(btn[1])btn[1].textContent='按单件利润';if(btn[2])btn[2].textContent='按主库顺序';const lock=document.getElementById('lockBtn');if(lock && !document.getElementById('refreshBtn')){const rb=document.createElement('button');rb.id='refreshBtn';rb.type='button';rb.className='lock-btn';rb.textContent='↻ 人工刷新';rb.title='清缓存并强制获取服务器最新版本';rb.style.marginRight='8px';rb.addEventListener('click',manualRefresh);lock.insertAdjacentElement('afterend',rb);}updateKpis();}
function renderSelect(){const s=document.getElementById('skuSelect');const current=s.value;s.innerHTML='';sorted.forEach(d=>{const o=document.createElement('option');o.value=d.rank;const p=d.stage==='STOP'?'STOP审计':rankEligible(d)?`${fmtMoney(d.profit)}｜${fmtPct(d.margin)}`:'候选待补';o.text=`主库${d.rank}｜${d.sku}｜${p}`;s.appendChild(o);});if(current && [...s.options].some(o=>o.value===current))s.value=current;else if(sorted[0])s.value=sorted[0].rank;s.onchange=()=>renderDetail(Number(s.value));}
function renderDetail(id){const d=data.find(x=>x.rank===id)||sorted[0];if(!d)return;const [bt,bc]=statusBadge(d),q=quality(d);const supplyState=linkStatus(d.links['1688'],d.linkStatus.supply);const wbState=linkStatus(d.links.wb,d.linkStatus.wb);const ozState=linkStatus(d.links.ozon,d.linkStatus.ozon);const review=reviewText(d);const reviewEvidence=safeText(d.reviewEvidence);const improvement=safeText(d.improvement);const blocker=safeText(d.blocker);const profitKnown=known(d,'profitKnown');const priceKnown=known(d,'priceKnown');const costKnown=known(d,'costKnown');const weightKnown=known(d,'weightKnown');document.getElementById('detail').innerHTML=`<div class="card"><div class="titleline"><div><h2>${d.sku}</h2><div class="family">产品卡｜${safeText(d.system)}｜${safeText(d.family)}｜优先级 ${safeText(d.priority)}</div></div><span class="badge ${bc}">${bt}</span></div><div style="margin-top:12px;padding:12px 14px;border:1px solid ${q==='B'?'#bfdbfe':'#fed7aa'};background:${q==='B'?'#eff6ff':'#fff7ed'};border-radius:14px;font-size:12px;line-height:1.65"><b>数据闭环等级：${q}</b> ｜ 主库行：${d.rank} ｜ 数据更新：${safeText(d.updated)} ｜ 研究状态：${safeText(d.researchStatus)}<br>${profitKnown?'当前净利润已可计算并参与排名。':'当前利润条件未闭环：产品卡保留，但不参与净利润排名。'}</div><div class="grid"><div class="metric"><small>Ozon当前/目标售价</small><strong>${fmtRub(d.price,priceKnown)}</strong><div class="sub">${safeText(d.officialCoverage)}</div></div><div class="metric"><small>实际/核价采购成本</small><strong>${fmtMoney(d.cost,costKnown)}</strong><div class="sub">${safeText(d.evidence)}</div></div><div class="metric"><small>单件跨境净利润</small><strong class="${profitKnown?(d.profit>=0?'pos':'neg'):''}">${fmtMoney(d.profit,profitKnown)}</strong><div class="sub">${profitKnown?'参与全库可计算SKU排名':'不可排名'}</div></div><div class="metric"><small>跨境净利率</small><strong class="${profitKnown?(d.margin>=15?'pos':'neg'):''}">${fmtPct(d.margin,profitKnown)}</strong><div class="sub">OR：利润&gt;¥10 或净利率&gt;15%</div></div><div class="metric"><small>15%采购上限</small><strong>${fmt async function gunzipBytes(bytes){if(typeof DecompressionStream==='undefined')throw new Error('gzip unsupported');const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(stream).arrayBuffer());}
async function decryptLegacyPayload(password){const te=new TextEncoder(),td=new TextDecoder();const keyMaterial=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(ENCRYPTED_PAYLOAD.salt),iterations:ENCRYPTED_PAYLOAD.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);let plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(ENCRYPTED_PAYLOAD.iv),additionalData:te.encode(ENCRYPTED_PAYLOAD.aad)},key,b64bytes(ENCRYPTED_PAYLOAD.cipher)));if(ENCRYPTED_PAYLOAD.compressed==='gzip')plain=await gunzipBytes(plain);return JSON.parse(td.decode(plain));}
async function decryptHybridPayload(password){const te=new TextEncoder(),td=new TextDecoder(),env=ENCRYPTED_PAYLOAD,ring=HYBRID_KEYRING,w=ring&&ring.wrappedPrivateKey,kw=env&&env.keyWrapping,de=env&&env.dataEncryption;if(!w||!kw||!de||ring.kind!=='SKU-PWA-HYBRID-KEYRING'||env.kind!=='SKU-PWA-HYBRID-ENVELOPE')throw new Error('hybrid schema');if(kw.publicKeyFingerprintSha256!==ring.publicKey.fingerprintSha256)throw new Error('hybrid key mismatch');const material=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);const wrapKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(w.salt),iterations:w.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const privateDer=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(w.iv),additionalData:te.encode(w.aad)},wrapKey,b64bytes(w.ciphertext));const privateKey=await crypto.subtle.importKey('pkcs8',privateDer,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);const rawDataKey=await crypto.subtle.decrypt({name:'RSA-OAEP'},privateKey,b64bytes(kw.wrappedKey));const dataKey=await crypto.subtle.importKey('raw',rawDataKey,{name:'AES-GCM'},false,['decrypt']);let plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(de.iv),additionalData:te.encode(de.aad)},dataKey,b64bytes(de.ciphertext)));if(env.compression==='gzip')plain=await gunzipBytes(plain);else throw new Error('hybrid compression');const decoded=JSON.parse(td.decode(plain));if(env.records!==undefined&&env.records!==decoded.length)throw new Error('record count mismatch');return decoded;}
async function decryptPayload(password){return ENCRYPTED_PAYLOAD&&ENCRYPTED_PAYLOAD.kind==='SKU-PWA-HYBRID-ENVELOPE'?decryptHybridPayload(password):decryptLegacyPayload(password);}
async function unlockWithPassword(password){const btn=document.getElementById('loginBtn'),err=document.getElementById('authError');btn.disabled=true;btn.textContent='验证中…';err.textContent='';try{const decoded=await decryptPayload(password);if(!Array.isArray(decoded)||decoded.length<1)throw new Error('payload');data=decoded.map(normalizeRow);sorted=[...data];document.getElementById('authPassword').value='';document.getElementById('authScreen').hidden=true;document.getElementById('appRoot').hidden=false;upgradeLabels();sortBy('profit');return true;}catch(e){data=[];sorted=[];err.textContent=(String(e&&e.message).includes('gzip unsupported'))?'当前浏览器版本不支持全库压缩解密，请升级iOS/Safari。':'密码错误或数据版本异常，请重新输入。';return false;}finally{btn.disabled=false;btn.textContent='登录';}}
function lockApp(){data=[];sorted=[];document.getElementById('skuSelect').innerHTML='';document.getElementById('detail').innerHTML='';document.getElementById('tbody').innerHTML='';document.getElementById('appRoot').hidden=true;document.getElementById('authScreen').hidden=false;const p=document.getElementById('authPassword');p.value='';p.focus();}
document.title='全库 SKU 选品产品卡';const initialFoot=document.querySelector('.auth-foot');if(initialFoot)initialFoot.textContent='全库SKU数据已加密存储。关闭或重新加载页面后需要重新输入密码。';document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();await unlockWithPassword(document.getElementById('authPassword').value)});document.getElementById('lockBtn').addEventListener('click',lockApp);setTimeout(()=>document.getElementById('authPassword').focus(),100);if('serviceWorker' in navigator){const tokenSource=ENCRYPTED_PAYLOAD.salt||ENCRYPTED_PAYLOAD.dataEncryption?.iv||ENCRYPTED_PAYLOAD.keyWrapping?.wrappedKey||'build';const swToken=`v1-6-${String(tokenSource).replace(/[^A-Za-z0-9]/g,'').slice(0,12)}`;window.addEventListener('load',()=>navigator.serviceWorker.register(`./sw.js?v=${encodeURIComponent(swToken)}`).catch(()=>{}));}const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isIOS&&!standalone&&!localStorage.getItem('pwaTipHidden')){setTimeout(()=>{const el=document.getElementById('installTip');if(el)el.style.display='block'},1200);}
